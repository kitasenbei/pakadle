<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Flag Text</title>
        <meta
            name="description"
            content="Search a country and copy its flag as text: emoji flag, emoji squares, or ASCII art."
        />
        <link rel="canonical" href="https://pakadle.fun/flags" />
        <meta name="theme-color" content="#FBF5EA" />

        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Pakadle" />
        <meta property="og:title" content="Flag Text — copy any country flag as text" />
        <meta
            property="og:description"
            content="Search a country and copy its flag as an emoji flag, a grid of coloured emoji squares, or ASCII art."
        />
        <meta property="og:url" content="https://pakadle.fun/flags" />
        <meta name="twitter:card" content="summary" />

        <link rel="icon" type="image/png" href="/favicon.png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/flags/style.css" />
    </head>
    <body>
        <header>
            <h1>Flag Text</h1>
        </header>

        <main>
            <p id="subtitle">Search a country, copy its flag as text 🏳️</p>

            <div class="search">
                <input
                    id="q"
                    type="search"
                    placeholder="Search a country…"
                    autocomplete="off"
                    autocapitalize="off"
                    spellcheck="false"
                    aria-label="Search a country"
                />
            </div>

            <div class="cols">
                <ul id="list" aria-label="Countries"></ul>
                <div id="detail" aria-live="polite"></div>
            </div>

            <p class="note">
                Flags with detailed coats of arms are approximations: the
                stripes and main charges are there, the fine engraving is not.
            </p>
        </main>

        <script src="/flags/render.js"></script>
        <script src="/flags/data.js"></script>
        <script src="/flags/app.js"></script>
    </body>
</html>
