<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Pakadoom</title>
        <meta name="description" content="Shareware Doom, redrawn every frame from Umamusume portraits." />
        <link rel="canonical" href="https://pakadle.fun/pakadoom" />
        <meta name="theme-color" content="#000000" />

        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Pakadle" />
        <meta property="og:title" content="Doom but it's uma tails" />
        <meta property="og:description" content="Shareware Doom, redrawn every frame from Umamusume portraits." />
        <meta property="og:url" content="https://pakadle.fun/pakadoom" />
        <meta property="og:image" content="https://pakadle.fun/og-image.png" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Doom but it's uma tails" />

        <link rel="icon" type="image/png" href="/favicon.png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="stylesheet" href="/pakadoom/style.css" />
    </head>
    <body>
        <canvas id="screen" role="img" aria-label="Umamusume portrait mosaic of Doom"></canvas>

        <div id="boot">
            <ul id="checks">
                <li id="chkP">Portraits</li>
                <li id="chkD">Doom</li>
            </ul>
            <p id="loading">Loading.</p>
            <button id="start" type="button" hidden>Click to start</button>
        </div>

        <!-- Doom draws here. SDL finds and sizes this canvas by the id "canvas", so the id is fixed. The mosaic reads this canvas every frame and shows the result on #screen. -->
        <canvas id="canvas" tabindex="-1"></canvas>

        <script src="/pakadoom/opl3.min.js"></script>
        <script src="/pakadoom/game.js"></script>
        <script src="/pakadoom/websockets-doom.js"></script>
    </body>
</html>
