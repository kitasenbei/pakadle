# Superseded by the self-hosted pipeline in deploy/ (see README, "Deploying").
# The server now runs a container whose image comes from its own registry, so an
# rsync of source into /srv/pakadle/app would write files nothing reads and then
# restart the container onto the same image it was already running.
#
# Left here, dispatch-only, as an escape hatch. It cannot fire on a push, so the
# two paths can never race to deploy the same box.
name: deploy (superseded, manual only)

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  HOST: 139.162.170.246
  APP_USER: pakadle

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Minify client JS
        run: |
          npx --yes esbuild game.js --minify --outfile=game.min.tmp.js
          mv game.min.tmp.js game.js
          npx --yes esbuild pakapix/game.js --minify --outfile=pakapix/game.min.tmp.js
          mv pakapix/game.min.tmp.js pakapix/game.js
          echo "minified game.js -> $(wc -c < game.js) bytes; pakapix/game.js -> $(wc -c < pakapix/game.js) bytes"

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync app to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '*.db' --exclude '*.db-journal' --exclude '*.db-wal' --exclude '*.db-shm' \
            --exclude '*.mp4' \
            ./ "$APP_USER@$HOST:/srv/pakadle/app/"

      - name: Restart service
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$APP_USER@$HOST" \
            'sudo systemctl restart pakadle && sleep 1 && systemctl is-active pakadle'
